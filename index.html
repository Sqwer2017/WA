<!doctype html>
<html lang="ru" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040508" />
    <title>iWA ONE PRO — Triangle Bot | Футуристичный модульный робот</title>
    <meta
      name="description"
      content="iWA ONE PRO (Triangle Bot) — компактный модульный робот в корпусе из шлифованного алюминия 10.2×10.2 см. Интерактивный 3D-обзор, чертёж v1.0 и предзаказ."
    />
    <link rel="icon" type="image/png" href="/WA/images/iwa-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('iwa-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-sky-400/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
